# How Toast data is mapped onto the Stolen Bell tip-out.
# The tip-out math lives in skills/stolen-bell-tipout/scripts/tipout.py; this file only
# controls how the MCP server buckets Toast data for it. Changes apply on the next run.

# Service periods, restaurant local time. Lunch runs lunchStart–dinnerStart; Dinner runs
# dinnerStart–close (after midnight still counts as Dinner). Hours before lunchStart count
# toward neither period.
periods:
  lunchStart: "11:00"
  dinnerStart: "16:00"

# Where each period's card tips and auto-gratuity come from:
#   time_entries - what Toast credited to each shift (Toast's own allocation, as on its Tip Summary).
#                  A shift that crosses into the next period is split by time worked on each side. (default)
#   check_time   - rebuilt from the day's checks; a check open across both periods is shared by time open in each
#   check_items  - rebuilt from the day's checks; shared by the sales rung in each period
#   payment      - rebuilt from the day's checks; all to the period each payment was made in
cardTipSource: time_entries

# Toast sales categories that count as food for the kitchen's 10%.
foodCategories:
  - Food

# Toast job title -> tip-out role. Roles: Bartender, Server (both share the bar/server remainder),
# Host, Barback, Busser, Runner (support), Kitchen, or "ignore" to leave a job out entirely.
# Matching ignores case, extra spaces and punctuation ("Lead Bartender - ADMIN" matches "Lead Bartender ADMIN"),
# but the words must match: "Chef" and "Chef OFFICE" are different jobs.
roles:
  # Bar & servers
  Bartender: Bartender
  Lead Bartender: Bartender
  Server: Server
  Lead Server: Server
  # Support
  Host: Host
  Barback: Barback
  Busser: Busser
  Runner: Runner
  # Kitchen
  Chef: Kitchen
  Sous Chef: Kitchen
  Chef de Partie: Kitchen
  Kitchen All Rounder: Kitchen
  Cook: Kitchen
  # Not tipped
  Chef OFFICE: ignore
  Admin: ignore
  General Manager: ignore
  Owner: ignore
  Lead Bartender ADMIN: ignore

# Any Toast job not listed above shares the bar/server remainder. The tool notes which jobs were
# handled this way on each run. Use "stop" instead to make every job be listed deliberately.
otherJobs: Server

# Optional: override the restaurant time zone from Toast (IANA name, e.g. America/Vancouver).
# timeZone: America/Vancouver
