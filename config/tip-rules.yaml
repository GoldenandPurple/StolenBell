# Tip-out rules. Edit to match your house policy; changes apply on the next calculation.
# Job titles and sales categories must match Toast exactly (case-insensitive).
# Run the get_restaurant_setup tool to see the names Toast uses.
#
# Rules run in order, once per business day. Each rule:
#   from:            job titles that pay in
#   to:              job titles that share the pot (may overlap with `from` to make a pool)
#   basis:           sales | tips | remaining_tips
#   percent:         percent of the basis each contributor pays
#   salesCategories: (basis: sales only) count only these categories, e.g. alcohol for a bar tip-out
#   split:           hours (default) | equal
#   points:          optional weights per recipient job, e.g. { Busser: 1, Host: 0.5 }
#   capAtTips:       true = never take more than the contributor currently holds

tipSources:
  cardTips: true
  declaredCashTips: true
  gratuities: true

rules:
  - name: Bar tip-out
    from: [Server]
    to: [Bartender]
    basis: sales
    salesCategories: [Liquor, Beer, Wine]
    percent: 5
    capAtTips: true

  - name: Support staff
    from: [Server, Bartender]
    to: [Busser, Host]
    basis: sales
    percent: 2
    points:
      Busser: 1
      Host: 0.5
    capAtTips: true

  - name: Kitchen
    from: [Server, Bartender]
    to: [Line Cook, Dishwasher]
    basis: tips
    percent: 5
